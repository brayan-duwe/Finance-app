<script>
  // Show the "number of installments" field only when "Repeats" is set to Installments.
  (() => {
    const repeats = document.querySelector('select[name="frequency"]');
    const field = document.querySelector(".field-installment_total");
    if (!repeats || !field) return;
    const sync = () => { field.hidden = repeats.value !== "installments"; };
    repeats.addEventListener("change", sync);
    sync();
  })();
</script>
